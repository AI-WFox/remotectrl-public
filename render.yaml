services:
  - type: web
    name: remotectrl-public-demo
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: REMOTECTRL_SECRET_KEY
        generateValue: true
      - key: REMOTECTRL_ENV
        value: production
      - key: REMOTECTRL_ADMIN_EMAIL
        sync: false
      - key: REMOTECTRL_ADMIN_PASSWORD
        sync: false
      - key: REMOTECTRL_CORS_ORIGINS
        value: https://remotectrl-public-demo.onrender.com
